<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/StyleFormularios.css') }}">
    <title>Registrar servicio</title>
</head>
<body>
<div class="card">
    <form class="form-grid" action="{{ url_for('servicios_guardar') }}" method="post">
        <h2 style="grid-column: span 2;">REGISTRA UN SERVICIO</h2>
        <label for="nombreServicio">Nombre del servicio</label><input id="nombreServicio" name="nombreServicio" required>
        <label for="descripcionServicio">Descripción</label><input id="descripcionServicio" name="descripcionServicio" required>
        <label for="precioBase">Precio base</label><input type="number" id="precioBase" name="precioBase" min="0" step="0.01" required>
        {% if tiene_duracion %}
        <label for="duracion">Duración</label><input type="time" id="duracion" name="duracion" required>
        {% endif %}
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            {% for categoria in categorias %}<option value="{{ categoria }}">{{ categoria }}</option>{% endfor %}
        </select>
        <label for="idUsuarioFK">Responsable</label>
        <select id="idUsuarioFK" name="idUsuarioFK" required>
            <option value="" disabled selected>Selecciona un usuario</option>
            {% for usuario in usuarios %}<option value="{{ usuario.idUsuario }}">{{ usuario.nombreCompleto }}</option>{% endfor %}
        </select>
        <label for="idInsumoFK">Insumo asociado</label>
        <select id="idInsumoFK" name="idInsumoFK" required>
            <option value="" disabled selected>Selecciona un insumo</option>
            {% for insumo in insumos %}<option value="{{ insumo.idInsumo }}">{{ insumo.nombreInsumo }}</option>{% endfor %}
        </select>
        <input type="hidden" name="estado" value="Activo">
        <a class="btn-cancelar" href="{{ url_for('listar_servicios') }}">Cancelar</a>
        <button type="submit" class="btn-login">Registrar</button>
    </form>
</div>
</body>
</html>
