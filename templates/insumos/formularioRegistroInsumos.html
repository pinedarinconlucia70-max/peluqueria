<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/StyleFormularios.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    <title>Registrar insumo</title>
</head>
<body>
<div class="card insumo-card">
    <form class="form-grid insumo-form" action="{{ url_for('insumos_guardar') }}" method="post">
        <h2>REGISTRA UN INSUMO</h2>
        <label for="nombreInsumo">Nombre del insumo</label><input id="nombreInsumo" name="nombreInsumo" required>
        <label for="descripcionInsumo">Descripción</label><input id="descripcionInsumo" name="descripcionInsumo" required>
        <label for="fechaVencimiento">Fecha de vencimiento</label><input type="date" id="fechaVencimiento" name="fechaVencimiento" required>
        <label for="stockActual">Stock actual</label><input type="number" id="stockActual" name="stockActual" min="0" required>
        <label for="stockMinPosible">Stock mínimo</label><input type="number" id="stockMinPosible" name="stockMinPosible" min="0" required>
        <label for="horaActualizacion">Hora del ingreso</label><input type="time" id="horaActualizacion" name="horaActualizacion" required>
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            {% for value, label in categorias.items() %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        <label for="categoriaInsumo">Categoría</label>
        <select id="categoriaInsumo" name="categoriaInsumo" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            <option value="1">Tintes y Coloración</option><option value="2">Químicos y Alisados</option>
            <option value="3">Cuidado Capilar</option><option value="4">Uñas y Manicura</option>
            <option value="5">Depilación y Estética</option><option value="6">Material Desechable</option>
            <option value="7">Herramientas y Barbería</option>
        </select>
        <a class="btn-cancelar" href="{{ url_for('listar_insumos') }}">Cancelar</a>
        <button type="submit" class="btn-login">Registrar insumo</button>
    </form>
</div>
</body>
</html>
